name: Test and build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  spotify-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local Spotify service and lint PHP
        run: |
          docker build -t mio-spotify-test integrations/spotify-lyrics-api
          docker run --rm --entrypoint php mio-spotify-test -l /app/src/Spotify.php
          docker run --rm --entrypoint php mio-spotify-test -l /app/src/SpotifyException.php
          docker run --rm --entrypoint php mio-spotify-test -l /app/api/index.php
      - name: Verify unauthenticated protocol without any account credentials
        run: |
          docker run -d --name mio-spotify-test -p 127.0.0.1:8765:8080 mio-spotify-test
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          for attempt in range(20):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/', timeout=2)
              except urllib.error.HTTPError as e:
                  assert e.code == 400
                  assert json.load(e)['error'] is True
                  break
              except OSError:
                  time.sleep(.25)
          else:
              raise RuntimeError('Service failed to start')
          try:
              urllib.request.urlopen('http://127.0.0.1:8765/?trackid=5f8eCNwTlr0RJopE9vQ6mB', timeout=3)
          except urllib.error.HTTPError as e:
              assert e.code == 500
              assert json.load(e)['error'] is True
          else:
              raise RuntimeError('Missing credentials must not be treated as successful lyrics')
          PY
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve an already published release
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json id 2>$null
          if ($LASTEXITCODE -eq 0) { 'exists=true' >> $env:GITHUB_OUTPUT } else { 'exists=false' >> $env:GITHUB_OUTPUT }
          exit 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -r requirements-lock.txt
      - run: .venv/Scripts/python -m pytest -q
      - run: ./scripts/build.ps1
        shell: pwsh
      - name: Smoke test the packaged executable
        shell: pwsh
        run: |
          $report = Join-Path (Get-Location) 'build/packaged-smoke.json'
          $process = Start-Process -FilePath 'dist/MioMusic/MioMusic.exe' -ArgumentList @('--smoke-test', $report) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged smoke test failed' }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: MioMusic-windows-x64
          path: dist/MioMusic/
      - if: startsWith(github.ref, 'refs/tags/v') && steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: Compress-Archive -Path dist/MioMusic -DestinationPath dist/MioMusic-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v') && steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MioMusic-windows-x64.zip
          generate_release_notes: true
    permissions:
      contents: write
